spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

flask.api.base-url=http://localhost:5000
flask.api.recommend-endpoint=/recommend
flask.api.health-endpoint=/health
flask.api.skills-endpoint=/skills
flask.api.connect-timeout=1000
flask.api.read-timeout=1000

gemini.api.key=mock-gemini-key-for-testing
gemini.api.model=gemini-2.5-flash

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
app.upload.dir=target/uploads/
