name: Java CI/CD with Maven and Docker Hub

on:
  push:
    branches: ["main", "Update_Project"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — CI: Chạy unit test + xác minh Docker build được
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'corretto'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw
        working-directory: Edu_Recommend/doan

      - name: Run Maven Tests
        run: ./mvnw clean test
        working-directory: Edu_Recommend/doan

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — CD: Build và push Docker image lên Docker Hub
#   Chỉ chạy khi push vào nhánh main (sau khi test pass)
# ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bật Docker BuildKit (build nhanh hơn, hỗ trợ multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào Docker Hub bằng Secrets đã cấu hình trên GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tạo metadata: tags và labels cho image
      # Tag sẽ gồm: latest  +  <ngày-tháng>  +  <7 ký tự commit SHA>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/edurecommend-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}

      # Build image và push lên Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layer để build lần sau nhanh hơn
          cache-from: type=gha
          cache-to: type=gha,mode=max
